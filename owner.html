<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6eadf" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Isla Owner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f6eadf; --surface: #fbf2e9; --border: #e6cfba; --text: #3a2a1e; --muted: #8a7262; --title: #23170e; --orange: #f2600d; --green: #3f8f14; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 90% 55% at 50% -5%, rgba(255, 122, 40, 0.3), transparent 75%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { color: var(--title); font-size: 1.5rem; margin: 0 0 4px; }
      h2 { color: var(--title); font-size: 1.05rem; margin: 26px 0 10px; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
      .signin { max-width: 380px; margin: 40px auto 0; }
      label { display: block; font-weight: 600; font-size: 0.9rem; margin: 14px 0 6px; }
      input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff8f1; font: inherit; }
      button { font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--border); background: #fff8f1; color: var(--title); font-weight: 600; }
      button.primary { background: var(--orange); border-color: var(--orange); color: #fff; width: 100%; margin-top: 16px; }
      button.wide { width: 100%; }
      .or { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 14px 0 0; }
      .error { color: #c0392b; font-size: 0.9rem; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
      .tile b { display: block; font-size: 1.6rem; color: var(--title); line-height: 1.2; }
      .tile span { color: var(--muted); font-size: 0.82rem; }
      .warn b { color: var(--orange); }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; }
      td.email { word-break: break-all; }
      .table { overflow-x: auto; }
    </style>
  </head>
  <body>
    <!-- The owners' dashboard: a page of its own, not linked from the app. The data is checked on the server
         (owner_stats), so only the owners' accounts can read it even if someone finds this page. -->
    <main id="app"><p class="muted">Loading…</p></main>
    <script type="module" src="/src/owner.ts"></script>
  </body>
</html>
