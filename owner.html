<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6eadf" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Isla Owner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f6eadf; --surface: #fbf2e9; --border: #e6cfba; --text: #3a2a1e; --muted: #8a7262; --title: #23170e; --orange: #f2600d; --green: #3f8f14; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 90% 55% at 50% -5%, rgba(255, 122, 40, 0.3), transparent 75%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { color: var(--title); font-size: 1.5rem; margin: 0 0 4px; }
      h2 { color: var(--title); font-size: 1.05rem; margin: 26px 0 10px; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
      .signin { max-width: 380px; margin: 40px auto 0; }
      label { display: block; font-weight: 600; font-size: 0.9rem; margin: 14px 0 6px; }
      input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff8f1; font: inherit; }
      button { font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--border); background: #fff8f1; color: var(--title); font-weight: 600; }
      button.primary { background: var(--orange); border-color: var(--orange); color: #fff; width: 100%; margin-top: 16px; }
      button.wide { width: 100%; }
      .or { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 14px 0 0; }
      .error { color: #c0392b; font-size: 0.9rem; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .rows { padding: 4px 16px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .row:last-child { border-bottom: none; }
      .row b { color: var(--title); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
      .email { word-break: break-all; }
      .tabs, .chips, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .tabs { margin: 18px 0 8px; }
      .tabs button.on, .chips button.on { border-color: var(--orange); color: var(--title); background: #fff; }
      .chips { margin: 10px 0; }
      .chips button, .actions button, .small-btn { padding: 7px 12px; font-size: 0.85rem; }
      .chips label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; margin-right: 10px; }
      .chips input[type='radio'] { width: auto; }
      input[type='search'] { margin-top: 8px; }
      .account { margin-bottom: 12px; }
      .account-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .account-plan { margin: 6px 0 2px; font-weight: 600; color: var(--title); }
      .account .muted { margin: 0 0 10px; }
      .small { font-size: 0.85rem; }
      .badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #eadccd; color: var(--title); }
      .badge-red { background: #f6d5d2; color: #c0392b; }
      .actions .danger { color: #c0392b; border-color: #f0c4bf; }
      form.give { margin-top: 12px; padding: 12px; border: 1px dashed var(--border); border-radius: 12px; }
      form.give input[type='date'] { width: auto; margin-left: 6px; }
      .error.ok { color: var(--green); }
      .notify { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 10px 0 0; }
      .notify input { width: auto; }
      .gift-left { margin: 0 0 4px; color: var(--green); font-weight: 600; }
      .fields { display: flex; flex-wrap: wrap; gap: 10px; }
      .fields label { flex: 1 1 100px; margin-top: 0; }
      form.give label input, form.give textarea { margin-top: 4px; }
      textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff8f1; font: inherit; resize: vertical; }
    </style>
  </head>
  <body>
    <!-- The owners' dashboard: a page of its own, not linked from the app. The data is checked on the server
         (owner_stats), so only the owners' accounts can read it even if someone finds this page. -->
    <main id="app"><p class="muted">Loading…</p></main>
    <script type="module" src="/src/owner.ts"></script>
  </body>
</html>
